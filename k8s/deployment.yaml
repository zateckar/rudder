apiVersion: v1
kind: Namespace
metadata:
  name: rudder
  labels:
    app.kubernetes.io/name: rudder
    app.kubernetes.io/part-of: rudder
---
apiVersion: v1
kind: Secret
metadata:
  name: rudder-secrets
  namespace: rudder
  labels:
    app.kubernetes.io/name: rudder
type: Opaque
stringData:
  # Set ADMIN_PASSWORD to auto-create the admin account on first boot.
  # Username is always "admin". Once the user exists this var is ignored.
  ADMIN_PASSWORD: "CHANGE_ME_TO_A_STRONG_PASSWORD"

  # Optional — the app auto-generates these on first boot and persists them in
  # the data volume.  Set them explicitly here if you want secrets that survive
  # a PVC replacement or a move to a different cluster.
  # SESSION_SECRET: ""
  # ENCRYPTION_KEY: ""

  # Optional: shared secret for worker self-registration
  WORKER_REGISTRATION_SECRET: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rudder-config
  namespace: rudder
  labels:
    app.kubernetes.io/name: rudder
data:
  NODE_ENV: "production"
  PORT: "3000"
  DATABASE_URL: "file:/app/data/rudder.db"
  SESSION_MAX_AGE: "604800"
  # Set to the external URL users reach the app on.
  PUBLIC_URL: "https://rudder.example.com"
  # PROTOCOL_HEADER and HOST_HEADER are already baked into the Docker image
  # (ENV PROTOCOL_HEADER=X-Forwarded-Proto / HOST_HEADER=X-Forwarded-Host).
  # Override here only if your ingress uses non-standard header names.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rudder-data
  namespace: rudder
  labels:
    app.kubernetes.io/name: rudder
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rudder
  namespace: rudder
  labels:
    app.kubernetes.io/name: rudder
    app.kubernetes.io/component: web
spec:
  # Must stay 1. Rudder holds its deploy locks, rate-limit counters, terminal
  # tokens and WebSocket registry in process memory, and writes to SQLite on the
  # PVC below. A second replica does not share any of it: two instances would
  # each believe they held a worker's deploy lock and hand out the same host
  # port, and the second SQLite writer corrupts the first one's WAL.
  # See "Run exactly one instance" in the README.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rudder
      app.kubernetes.io/component: web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rudder
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: rudder
          image: ghcr.io/OWNER/rudder:latest
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: rudder-config
            - secretRef:
                name: rudder-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rudder-data
---
apiVersion: v1
kind: Service
metadata:
  name: rudder
  namespace: rudder
  labels:
    app.kubernetes.io/name: rudder
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rudder
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rudder
  namespace: rudder
  labels:
    app.kubernetes.io/name: rudder
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: rudder.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rudder
                port:
                  name: http
  tls:
    - hosts:
        - rudder.example.com
      secretName: rudder-tls
