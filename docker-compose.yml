version: "3.8"

# ── Minimal required config ───────────────────────────────────────────────────
# Create a .env file (or export vars) with at minimum:
#
#   ADMIN_PASSWORD=yourpassword        # sets the initial admin login password
#   PUBLIC_URL=https://your-domain     # external URL shown in links & OIDC redirects
#   ORIGIN=https://your-domain         # external URL, used for CSRF origin checks
#
# Everything else is auto-configured on first boot.
# ─────────────────────────────────────────────────────────────────────────────

services:
  rudder:
    image: ghcr.io/zateckar/rudder:latest
    container_name: rudder
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/rudder.db
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      # Required behind a reverse proxy: SvelteKit rejects cross-origin form
      # posts by comparing against this. Must match the browser-facing URL.
      - ORIGIN=${ORIGIN:-${PUBLIC_URL:-http://localhost:3000}}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-604800}

      # ── Admin bootstrap ──────────────────────────────────────────────────────
      # Creates username "admin" with this password on first boot.
      # Once the user exists this variable is ignored — change the password in the UI.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}

      # ── Secrets ──────────────────────────────────────────────────────────────
      # Auto-generated on first boot and persisted in the data volume.
      # Provide explicit values to keep secrets stable if you ever replace the volume.
      - SESSION_SECRET=${SESSION_SECRET:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}

      # ── Optional extras ───────────────────────────────────────────────────────
      - WORKER_REGISTRATION_SECRET=${WORKER_REGISTRATION_SECRET:-}
      # Comma-separated host directories applications may bind-mount.
      # Empty (default) disables host path mounts; named volumes still work.
      - ALLOWED_HOST_MOUNT_PREFIXES=${ALLOWED_HOST_MOUNT_PREFIXES:-}
      # Image for the throwaway container that backs up, restores and copies a
      # volume. Needs a shell and `cp`; pulled on the worker on first use.
      - VOLUME_TOOL_IMAGE=${VOLUME_TOOL_IMAGE:-docker.io/library/busybox:1.36}
      # Caps a volume restore upload, which sends the whole archive in one
      # request. adapter-node's own default is 512K, which rejects any real
      # restore before the route runs.
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-4G}
    volumes:
      - rudder-data:/app/data
    networks:
      - shared-net

volumes:
  rudder-data:
    driver: local

networks:
  shared-net:
    external: true