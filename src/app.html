<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		%sveltekit.head%
	</head>
	<!--
		No CSRF token field here. `%sveltekit.csrf%` is not a SvelteKit
		placeholder, so the hidden input that used to sit here shipped that
		literal string on every page, and nothing in the app ever read `__csrf`.
		It implied a mechanism that did not exist.

		The real protection is SvelteKit's own origin check on form submissions
		(`csrf.checkOrigin`, on by default), plus session cookies being
		SameSite — see svelte.config.js and src/lib/auth.
	-->
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
