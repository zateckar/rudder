entryPoints:
  # Index 0, and the only one that can be anything else. ACME's TLS-ALPN-01
  # challenge is served on 443 and nowhere else, so every hostname needs a
  # router here or it never obtains the certificate the other entryPoints would
  # serve. An application's first published port always lands on this one.
  websecure:
    address: ":443"
  # Indices 1-4, for an application that publishes more than one HTTP port on
  # one hostname. Same TLS, same certificate, same middleware chain — the only
  # difference is which port the client connects to.
  #
  # Named for the index rather than the port: a route carries "the second
  # published port", and a name like `ep1443` would have to be reworked
  # everywhere if these numbers ever move.
  #
  # Bound on every worker whether or not anything routes here. An entryPoint
  # with no router answers the handshake and returns 404, which is a smaller
  # thing to explain than a per-worker toggle that has to be kept in step with
  # the firewall.
  websecure-1:
    address: ":1443"
  websecure-2:
    address: ":2443"
  websecure-3:
    address: ":3443"
  websecure-4:
    address: ":4443"
  # Prometheus scrape target. Bound to loopback, not `:8082` — the host
  # firewall would drop external traffic anyway, but an entryPoint that only
  # ever listens on 127.0.0.1 cannot be re-exposed by a firewall mistake.
  # Reached from outside through the mTLS-protected metrics.<base> router in
  # /etc/traefik/dynamic/metrics.yml.
  metrics:
    address: "127.0.0.1:8082"

metrics:
  prometheus:
    entryPoint: metrics
    # addRoutersLabels is the one that matters: it produces
    # traefik_router_requests_total / _request_duration_seconds labelled by
    # router, and router names derive from application names, so these map
    # straight onto applications. It defaults to false.
    addRoutersLabels: true
    addServicesLabels: true
    addEntryPointsLabels: true

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: {{ACME_EMAIL}}
      storage: /etc/traefik/acme/acme.json
      tlsChallenge: {}

experimental:
  plugins:
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: BOUNCER_VERSION_PLACEHOLDER
    traefik-oidc-auth:
      moduleName: github.com/sevensolutions/traefik-oidc-auth
      version: OIDC_VERSION_PLACEHOLDER

log:
  level: INFO

accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  bufferingSize: 100
