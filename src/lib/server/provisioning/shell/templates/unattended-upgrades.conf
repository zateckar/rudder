// /etc/apt/apt.conf.d/51rudder-unattended — written by Rudder provisioning.
//
// Ubuntu ships unattended-upgrades enabled, but only for the security pocket
// and only for origins in the default list. Podman lives in `universe`, which
// that list does not cover, so on a stock worker podman is never upgraded at
// all. Adding the `-updates` pocket brings it — and everything else Rudder
// installs from universe — into scope.
//
// Rudder writes this file rather than assuming the distro default, so a worker
// with unattended-upgrades disabled or narrowed does not silently look
// identical to one that is patching itself. The file sorts after the shipped
// 50unattended-upgrades, so these values win.

APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
APT::Periodic::AutocleanInterval "7";

Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
        "${distro_id}ESMApps:${distro_codename}-apps-security";
        "${distro_id}ESM:${distro_codename}-infra-security";
        "${distro_id}:${distro_codename}-updates";
};

// Deliberately false. Applications run on this host; rebooting one out from
// under them without warning is worse than carrying a pending kernel. Rudder
// reports `reboot_required` per worker instead, so the reboot is scheduled by
// someone who knows what is running.
Unattended-Upgrade::Automatic-Reboot "false";

Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-New-Unused-Dependencies "true";

// No global Dpkg::Options here on purpose: that key applies to every apt
// invocation on the host, including an administrator's interactive `apt
// upgrade`, and silently answering conffile prompts for a human is not
// Rudder's call. Provisioning passes --force-confold on its own command line
// instead, where the scope is exactly the unattended run it starts.
