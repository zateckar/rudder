api:
  server:
    # Loopback only. The bouncer runs inside Traefik, which uses host
    # networking, so 127.0.0.1 is reachable — but listening on 0.0.0.0 exposed
    # the LAPI (and therefore decision management, with a bouncer key that is
    # echoed during provisioning) to the internet.
    listen_uri: 127.0.0.1:8081
