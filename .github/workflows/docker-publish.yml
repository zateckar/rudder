name: Build and Push Docker Image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Base path for serving under a subpath (e.g., inno)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Tests
        run: bun test src

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-check
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build release image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the release image starts
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image=${IMAGE_TAGS%%$'\n'*}
          ADMIN_PASSWORD=$(openssl rand -hex 24)
          export ADMIN_PASSWORD
          container=$(docker run --detach --publish 127.0.0.1::3000 --env NODE_ENV=production --env ADMIN_PASSWORD "$image")
          trap 'docker logs "$container"; docker rm --force "$container" >/dev/null' EXIT
          address=$(docker port "$container" 3000/tcp)
          curl --fail --silent --show-error --retry 20 --retry-connrefused "http://$address/api/health"
          curl --fail --silent --show-error "http://$address/login" --output /dev/null

      - name: Push the tested release image
        if: github.event_name != 'pull_request'
        id: push
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          image=${IMAGE_TAGS%%$'\n'*}
          reference=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          echo "digest=${reference##*@}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
